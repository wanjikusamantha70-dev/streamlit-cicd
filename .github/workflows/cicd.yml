name: Streamlit CI/CD
on:
  push:
    branches:
      -main
    pull-request:
      branches:
        -main
jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        with:
          python-version: "3.11"
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run tests
        run: |
          pytest